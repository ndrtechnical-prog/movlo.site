<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12151f" />
      <stop offset="50%" stop-color="#0a0c12" />
      <stop offset="100%" stop-color="#1a1c26" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="500" height="750" fill="url(#bg)" />
  <rect width="500" height="750" fill="url(#glow)" />
  
  <!-- Film reel / cinema icon -->
  <g transform="translate(190, 290)">
    <circle cx="60" cy="60" r="50" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.4" />
    <circle cx="60" cy="60" r="20" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.4" />
    <circle cx="60" cy="30" r="8" fill="#f59e0b" opacity="0.5" />
    <circle cx="60" cy="90" r="8" fill="#f59e0b" opacity="0.5" />
    <circle cx="30" cy="60" r="8" fill="#f59e0b" opacity="0.5" />
    <circle cx="90" cy="60" r="8" fill="#f59e0b" opacity="0.5" />
  </g>
  
  <!-- Title / Logo -->
  <text x="250" y="440" font-family="'Syne', 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">MOVLO</text>
  <text x="250" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#9ca3af" text-anchor="middle" letter-spacing="1">CINEMATIC PREVIEW</text>
  
  <!-- Decorative border -->
  <rect x="20" y="20" width="460" height="710" rx="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />
</svg>
